<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dehta – The Future of Crypto Intelligence</title>
    <meta

      content="Dehta Labs is a next-generation crypto intelligence layer powered by real-time data, AI sentiment models, and on-chain signals for investors, creators, and builders."

      property="og:description"
      content="Dehta Labs is a next-generation crypto intelligence layer powered by real-time data, AI sentiment models, and on-chain signals for investors, creators, and builders."

      name="twitter:description"

      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"

    />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap"
